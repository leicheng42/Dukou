# The Swift toolchain comes from Xcode, which mise does not manage.
[tools]

[env]
CONFIG = "debug"

# Name the real SDK to the linker: Xcode 27 stamps SwiftPM builds with the
# deployment target instead, and macOS then runs Dukou in its macOS 14
# compatibility mode. Scripts/make-app.sh does the same for the bundle.
[tasks.build]
description = "Build the app, the share extension and the shared core"
run = '''swift build -Xlinker -platform_version -Xlinker macos -Xlinker "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' Resources/Info.plist)" -Xlinker "$(xcrun --sdk macosx --show-sdk-version)"'''

[tasks.test]
description = "Run the shared inbox test suite"
run = "swift test"

[tasks.run]
description = "Run the menu bar app from the build directory (uses the fallback app group)"
depends = ["build"]
run = ".build/debug/Dukou"

[tasks.icon]
description = "Package AppIcon-artwork.png as the macOS PNG, ICNS and README icon"
run = "swift Scripts/make-icon.swift Resources/AppIcon-artwork.png Resources/AppIcon.png Resources/AppIcon.icns Resources/Screenshots/app-icon-rounded.png"

[tasks.bundle]
description = "Assemble and ad-hoc sign a host-architecture dist/Dukou.app"
run = "CONFIG=release Scripts/make-app.sh"

[tasks.bundle-universal]
description = "Assemble and ad-hoc sign a Universal 2 dist/Dukou.app"
run = "CONFIG=release ARCHS='arm64 x86_64' Scripts/make-app.sh"

[tasks.install]
description = "Install dist/Dukou.app into ~/Applications so the extension registers"
run = "Scripts/install-dev-build.sh"

[tasks.reinstall]
description = "Rebuild the bundle and reinstall it in one step"
depends = ["bundle"]
run = "Scripts/install-dev-build.sh"

[tasks.i18n]
description = "Validate Simplified Chinese and English localization resources"
run = "swift Scripts/check-localizations.swift"

[tasks.dmg-background]
description = "Regenerate the 660x400 Retina Finder background for the disk image"
run = "swift Scripts/make-dmg-background.swift Resources/DMG/background.png"

[tasks.release-dry-run]
description = "Build a Developer ID-signed Universal 2 DMG without notarizing it"
run = "REQUIRE_CLEAN=0 REQUIRE_TAG=0 NOTARIZE=0 GENERATE_APPCAST=0 Scripts/release.sh"

[tasks.release]
description = "Build, notarize, staple and sign the tagged release feed"
run = "Scripts/release.sh"

[tasks.update-tap]
description = "Point the Homebrew cask at the published GitHub Release"
run = "Scripts/update-tap.sh"

[tasks.release-config]
description = "Validate bundle identifiers, app group, entitlements (app unsandboxed, extensions sandboxed), the five entries and the Sparkle feed, without reading any secret"
run = "Scripts/check-release-config.sh"

[tasks.verify]
description = "Build, test, validate localizations/release metadata and bundle"
depends = ["build", "test", "i18n", "release-config", "bundle"]
